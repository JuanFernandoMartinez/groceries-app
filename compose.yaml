services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
  adminer:
    image: adminer
    restart: always
    ports:
      - '3000:8080'
  
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    ports:
      - '3002:8080'
      - '3003:50000'
    volumes:
      - jenkins_vol:/var/jenkins_home

volumes:
  postgres_data:
  jenkins_vol:
