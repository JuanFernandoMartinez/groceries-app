info:
  name: Create Product
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/product"
  body:
    type: json
    data: |-
      {
        "name": "Leche",
        "summary": "Bebida Lactea",
        "price": 20.5,
        "measureUnit": "Litros"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
