server:
  port: 8081
spring:
    application:
        name: groceries-app
    datasource:
        url: jdbc:postgresql://postgres/mydatabase
        username: myuser
        password: secret
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
